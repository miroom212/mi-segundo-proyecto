<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<style>

/* =====================================================
   BASE
   ===================================================== */

* {
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: transparent !important;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;

    font-family:
        "Arial Narrow",
        "Helvetica Neue",
        Arial,
        sans-serif;
}


/* =====================================================
   MARCO PRINCIPAL
   ===================================================== */

#marco-neon {
    position: relative;

    width: 1150px;
    height: 175px;

    display: flex;
    align-items: center;

    overflow: hidden;

    background: transparent;

    border: 3px solid rgba(255, 235, 252, 0.95);
    border-radius: 90px;

    /* NEÓN EXTERIOR */
    box-shadow:

        /* núcleo blanco */
        0 0 2px #ffffff,

        /* rosa claro */
        0 0 6px #ffd9f8,
        0 0 11px #ff9be9,

        /* magenta */
        0 0 20px #ff4bd1,
        0 0 35px rgba(255, 0, 190, 0.80),

        /* halo exterior */
        0 0 60px rgba(255, 0, 180, 0.45),
        0 0 90px rgba(255, 0, 170, 0.20),

        /* iluminación interior */
        inset 0 0 3px #ffffff,
        inset 0 0 9px #ffb4ee,
        inset 0 0 18px rgba(255, 20, 190, 0.60);

    animation:
        respirarMarco 4s ease-in-out infinite alternate;
}


/* =====================================================
   SEGUNDO TUBO INTERIOR
   ===================================================== */

#marco-neon::before {
    content: "";

    position: absolute;

    top: 9px;
    bottom: 9px;
    left: 9px;
    right: 9px;

    border-radius: 80px;

    border: 1px solid rgba(255, 145, 225, 0.45);

    box-shadow:
        0 0 5px rgba(255, 90, 215, 0.30),
        inset 0 0 12px rgba(255, 40, 195, 0.25);

    pointer-events: none;
}


/* =====================================================
   REFLEJO INTERIOR
   ===================================================== */

#marco-neon::after {
    content: "";

    position: absolute;

    left: 6%;
    right: 6%;
    top: 18px;

    height: 1px;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.15),
        rgba(255,190,240,0.65),
        rgba(255,255,255,0.15),
        transparent
    );

    filter: blur(1px);

    pointer-events: none;
}


/* =====================================================
   ZONA DEL TEXTO
   ===================================================== */

#recorrido {
    position: absolute;

    width: 100%;
    height: 100%;

    left: 0;
    top: 0;

    display: flex;
    align-items: center;

    overflow: hidden;
}


/* =====================================================
   TEXTO NEÓN
   ===================================================== */

#bienvenida {
    position: absolute;

    left: 0;

    color: #fff8ff;

    font-size: 82px;
    font-weight: 300;

    letter-spacing: 4px;

    white-space: nowrap;

    /* Tubo de neón */
    text-shadow:

        /* CENTRO BLANCO */
        0 0 1px #ffffff,
        0 0 2px #ffffff,
        0 0 4px #fff5ff,

        /* ROSA CLARO */
        0 0 7px #ffc6f2,
        0 0 11px #ff94e7,

        /* ROSA INTENSO */
        0 0 17px #ff55d7,
        0 0 25px #ff1fc6,

        /* MAGENTA */
        0 0 38px rgba(255, 0, 190, 0.90),

        /* HALO */
        0 0 55px rgba(255, 0, 180, 0.60),
        0 0 80px rgba(255, 0, 170, 0.30);

    /*
       15 SEGUNDOS
       movimiento continuo
    */

    animation:
        moverTexto 15s linear infinite,
        respirarTexto 2.8s ease-in-out infinite alternate;

    will-change: transform;
}


/* =====================================================
   MOVIMIENTO DEL TEXTO
   15 SEGUNDOS
   ===================================================== */

@keyframes moverTexto {

    0% {
        transform: translateX(-105%);
    }

    100% {
        transform: translateX(1150px);
    }
}


/* =====================================================
   PULSACIÓN DEL NEÓN
   ===================================================== */

@keyframes respirarTexto {

    0% {

        text-shadow:

            0 0 1px #ffffff,
            0 0 2px #ffffff,
            0 0 4px #fff5ff,

            0 0 7px #ffc6f2,
            0 0 11px #ff94e7,

            0 0 17px #ff55d7,
            0 0 25px #ff1fc6,

            0 0 38px rgba(255,0,190,0.75),

            0 0 55px rgba(255,0,180,0.45),
            0 0 75px rgba(255,0,170,0.20);
    }


    100% {

        text-shadow:

            0 0 2px #ffffff,
            0 0 4px #ffffff,
            0 0 6px #fff5ff,

            0 0 9px #ffd3f6,
            0 0 14px #ffa0ea,

            0 0 21px #ff60dc,
            0 0 31px #ff20ca,

            0 0 45px rgba(255,0,195,0.90),

            0 0 65px rgba(255,0,180,0.60),
            0 0 90px rgba(255,0,170,0.30);
    }
}


/* =====================================================
   RESPIRACIÓN DEL MARCO
   ===================================================== */

@keyframes respirarMarco {

    0% {
        filter:
            brightness(0.94)
            saturate(0.95);
    }

    100% {
        filter:
            brightness(1.08)
            saturate(1.08);
    }
}

</style>
</head>


<body>


<div id="marco-neon">

    <div id="recorrido">

        <div id="bienvenida">
            BIENVENID@
        </div>

    </div>

</div>



<script>

/* =====================================================
   DATOS DE UTHERVERSE
   ===================================================== */

const params =
    new URLSearchParams(window.location.search);

let nombre =
    params.get("name");

const uid =
    params.get("uid");


/* Si no llega nombre */

if (!nombre || nombre.trim() === "") {

    nombre = "Visitante";

}


/* =====================================================
   MENSAJE
   ===================================================== */

const texto =
    document.getElementById("bienvenida");

texto.textContent =
    "BIENVENID@  " + nombre;

</script>


</body>
</html>
