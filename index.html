<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<style>

/* =====================================================
   GENERAL
   ===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;

    /* FONDO TRANSPARENTE */
    background: transparent !important;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;

    font-family:
        "Arial Narrow",
        "Helvetica Neue",
        Arial,
        sans-serif;
}


/* =====================================================
   CONTENEDOR DE SEGURIDAD

   Evita que se corte el neón del marco.
   ===================================================== */

#contenedor {
    position: relative;

    width: calc(100% - 100px);
    max-width: 1250px;

    padding: 45px 55px;

    overflow: visible;
}


/* =====================================================
   MARCO NEÓN
   ===================================================== */

#marco-neon {
    position: relative;

    width: 100%;
    height: 175px;

    display: flex;
    align-items: center;

    background: transparent;

    border: 3px solid #fff0fc;
    border-radius: 90px;

    box-shadow:

        /* Núcleo blanco */
        0 0 2px #ffffff,
        0 0 5px #ffffff,

        /* Rosa claro */
        0 0 9px #ffc2f0,
        0 0 15px #ff87e4,

        /* Rosa intenso */
        0 0 25px #ff42d0,

        /* Halo exterior */
        0 0 38px rgba(255, 0, 190, 0.70),
        0 0 55px rgba(255, 0, 180, 0.40),

        /* Brillo interior */
        inset 0 0 3px #ffffff,
        inset 0 0 9px #ffb4ee,
        inset 0 0 18px rgba(255, 20, 190, 0.55);

    animation:
        respirarMarco 4s ease-in-out infinite alternate;
}


/* =====================================================
   SEGUNDA LÍNEA DEL MARCO
   ===================================================== */

#marco-neon::before {
    content: "";

    position: absolute;

    top: 9px;
    bottom: 9px;
    left: 9px;
    right: 9px;

    border-radius: 80px;

    border:
        1px solid rgba(255, 155, 228, 0.55);

    box-shadow:
        0 0 5px rgba(255, 80, 215, 0.35),
        inset 0 0 12px rgba(255, 40, 195, 0.25);

    pointer-events: none;

    z-index: 5;
}


/* =====================================================
   REFLEJO SUPERIOR
   ===================================================== */

#marco-neon::after {
    content: "";

    position: absolute;

    left: 8%;
    right: 8%;
    top: 17px;

    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,0.15),
            rgba(255,190,240,0.70),
            rgba(255,255,255,0.15),
            transparent
        );

    filter: blur(1px);

    pointer-events: none;

    z-index: 5;
}


/* =====================================================
   ZONA INTERIOR DEL MARCO

   Aquí se ocultan las letras cuando están fuera,
   pero NO se corta el resplandor exterior del marco.
   ===================================================== */

#recorrido {
    position: absolute;

    left: 3px;
    right: 3px;
    top: 3px;
    bottom: 3px;

    display: flex;
    align-items: center;

    overflow: hidden;

    border-radius: 86px;

    z-index: 2;
}


/* =====================================================
   TEXTO NEÓN
   ===================================================== */

#bienvenida {
    position: absolute;

    /* Centro exacto del marco */
    left: 50%;

    color: #fff8ff;

    font-size: 82px;
    font-weight: 300;

    letter-spacing: 4px;

    white-space: nowrap;

    text-shadow:

        /* Centro blanco */
        0 0 1px #ffffff,
        0 0 2px #ffffff,
        0 0 4px #fff5ff,

        /* Rosa claro */
        0 0 7px #ffc6f2,
        0 0 11px #ff94e7,

        /* Rosa fuerte */
        0 0 17px #ff55d7,
        0 0 25px #ff1fc6,

        /* Halo */
        0 0 38px rgba(255,0,190,0.85),
        0 0 55px rgba(255,0,180,0.50);

    /*
       IMPORTANTE:

       linear = movimiento constante.

       No acelera.
       No frena.
       No hace pausas intermedias.

       Solo para en el centro.
    */

    animation:
        recorridoTexto 18s linear infinite,
        respirarTexto 2.8s ease-in-out infinite alternate;

    will-change: transform;
}


/* =====================================================
   MOVIMIENTO

   0% ----------> entra

                  ↓

   41.666% ------> CENTRO

                  PAUSA 3 SEGUNDOS

   58.333% ------> continúa

                  ↓

   100% ---------> sale

   ===================================================== */

@keyframes recorridoTexto {

    /* ==========================================
       INICIO

       Texto completamente fuera por la izquierda
       ========================================== */

    0% {
        transform:
            translateX(calc(-575px - 100%));
    }


    /* ==========================================
       LLEGA AL CENTRO

       Movimiento constante hasta aquí
       ========================================== */

    41.6667% {
        transform:
            translateX(-50%);
    }


    /* ==========================================
       PAUSA DE 3 SEGUNDOS

       EXACTAMENTE la misma posición.
       Todo el texto queda visible.
       ========================================== */

    58.3333% {
        transform:
            translateX(-50%);
    }


    /* ==========================================
       SALIDA

       Continúa a velocidad constante
       hacia la derecha.
       ========================================== */

    100% {
        transform:
            translateX(575px);
    }
}


/* =====================================================
   BRILLO SUAVE DE LAS LETRAS

   Esto NO afecta al movimiento.
   Solo cambia ligeramente la iluminación.
   ===================================================== */

@keyframes respirarTexto {

    from {
        text-shadow:

            0 0 1px #ffffff,
            0 0 2px #ffffff,
            0 0 4px #fff5ff,

            0 0 7px #ffc6f2,
            0 0 11px #ff94e7,

            0 0 17px #ff55d7,
            0 0 25px #ff1fc6,

            0 0 38px rgba(255,0,190,0.70),
            0 0 50px rgba(255,0,180,0.40);
    }


    to {
        text-shadow:

            0 0 2px #ffffff,
            0 0 4px #ffffff,
            0 0 6px #fff5ff,

            0 0 9px #ffd3f6,
            0 0 14px #ffa0ea,

            0 0 21px #ff60dc,
            0 0 31px #ff20ca,

            0 0 45px rgba(255,0,195,0.85),
            0 0 60px rgba(255,0,180,0.50);
    }
}


/* =====================================================
   BRILLO SUAVE DEL MARCO
   ===================================================== */

@keyframes respirarMarco {

    from {
        filter:
            brightness(0.96)
            saturate(0.97);
    }

    to {
        filter:
            brightness(1.05)
            saturate(1.04);
    }
}


/* =====================================================
   PANTALLAS PEQUEÑAS
   ===================================================== */

@media (max-width: 900px) {

    #contenedor {
        width: calc(100% - 40px);

        padding:
            30px 25px;
    }

    #marco-neon {
        height: 150px;
    }

    #recorrido {
        border-radius: 73px;
    }

    #bienvenida {
        font-size: 65px;
    }
}

</style>
</head>


<body>


<div id="contenedor">

    <div id="marco-neon">

        <div id="recorrido">

            <div id="bienvenida">
                BIENVENID@
            </div>

        </div>

    </div>

</div>



<script>

/* =====================================================
   DATOS DE UTHERVERSE
   ===================================================== */

const params =
    new URLSearchParams(window.location.search);


let nombre =
    params.get("name");


const uid =
    params.get("uid");


/* =====================================================
   SI NO RECIBE NOMBRE
   ===================================================== */

if (!nombre || nombre.trim() === "") {

    nombre = "Visitante";

}


/* =====================================================
   MOSTRAR NOMBRE
   ===================================================== */

const texto =
    document.getElementById("bienvenida");


const marco =
    document.getElementById("marco-neon");


texto.textContent =
    "BIENVENID@  " + nombre;


/* =====================================================
   AJUSTAR AUTOMÁTICAMENTE NOMBRES LARGOS
   ===================================================== */

function ajustarTexto() {

    let tamaño = 82;

    texto.style.fontSize =
        tamaño + "px";


    /*
       Dejamos margen a izquierda
       y derecha cuando está parado.
    */

    const anchoMaximo =
        marco.clientWidth - 140;


    /*
       Si el nombre es largo,
       reduce automáticamente el tamaño.
    */

    while (
        texto.scrollWidth > anchoMaximo &&
        tamaño > 38
    ) {

        tamaño--;

        texto.style.fontSize =
            tamaño + "px";

    }

}


/* Ajustar al cargar */

requestAnimationFrame(
    ajustarTexto
);


/* Reajustar si cambia el tamaño */

window.addEventListener(
    "resize",
    ajustarTexto
);

</script>


</body>
</html>
