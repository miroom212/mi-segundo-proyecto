
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<style>
html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;

    /* FONDO TOTALMENTE TRANSPARENTE */
    background: transparent !important;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;

    /* Letra más fina, parecida a un tubo de neón */
    font-family: "Arial Narrow", Arial, Helvetica, sans-serif;
}


/* =========================
   MARCO NEÓN ROSA
   ========================= */

#marco-neon {
    display: inline-flex;
    justify-content: center;
    align-items: center;

    padding: 28px 55px;

    background: transparent;

    border: 3px solid #ffd5ff;
    border-radius: 60px;

    box-shadow:
        /* Núcleo brillante */
        0 0 3px #ffffff,
        0 0 6px #ffd5ff,

        /* Rosa intenso */
        0 0 12px #ff70e8,
        0 0 22px #ff28cc,

        /* Halo exterior */
        0 0 40px rgba(255, 0, 200, 0.85),
        0 0 65px rgba(255, 0, 180, 0.55),

        /* Brillo interior */
        inset 0 0 4px #ffffff,
        inset 0 0 10px #ff5ddd,
        inset 0 0 20px rgba(255, 0, 200, 0.65);
}


/* =========================
   LETRAS TIPO TUBO NEÓN
   ========================= */

#bienvenida {
    color: #fff4ff;

    font-size: 90px;

    /* Más fino que el anterior */
    font-weight: 300;

    text-align: center;
    white-space: nowrap;

    /* El núcleo blanco simula el tubo encendido */
    text-shadow:

        /* NÚCLEO BLANCO */
        0 0 1px #ffffff,
        0 0 2px #ffffff,
        0 0 4px #ffeaff,

        /* ROSA CLARO */
        0 0 7px #ffb6f5,
        0 0 10px #ff7be8,

        /* MAGENTA */
        0 0 16px #ff39d4,
        0 0 25px #ff00c8,

        /* RESPLANDOR EXTERIOR */
        0 0 40px rgba(255, 0, 200, 0.95),
        0 0 60px rgba(255, 0, 180, 0.75),
        0 0 85px rgba(220, 0, 180, 0.45);

    animation: neonRosa 2.2s ease-in-out infinite alternate;
}


/* =========================
   PEQUEÑA PULSACIÓN
   ========================= */

@keyframes neonRosa {

    from {
        text-shadow:
            0 0 1px #ffffff,
            0 0 2px #ffffff,
            0 0 4px #ffeaff,
            0 0 7px #ffb6f5,
            0 0 10px #ff7be8,
            0 0 16px #ff39d4,
            0 0 25px #ff00c8,
            0 0 40px rgba(255, 0, 200, 0.85),
            0 0 60px rgba(255, 0, 180, 0.60);
    }

    to {
        text-shadow:
            0 0 2px #ffffff,
            0 0 4px #ffffff,
            0 0 6px #ffeaff,
            0 0 10px #ffb6f5,
            0 0 15px #ff7be8,
            0 0 24px #ff39d4,
            0 0 35px #ff00c8,
            0 0 55px rgba(255, 0, 200, 1),
            0 0 80px rgba(255, 0, 180, 0.75);
    }
}

</style>
</head>

<body>

<div id="marco-neon">
    <div id="bienvenida">BIENVENID@</div>
</div>


<script>

const params = new URLSearchParams(window.location.search);

const nombre =
    params.get("name") ||
    params.get("membername") ||
    "Visitante";

document.getElementById("bienvenida").textContent =
    "BIENVENID@ " + nombre;

</script>

</body>
</html>
