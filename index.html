<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<style>

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: transparent !important;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Arial Narrow", Arial, Helvetica, sans-serif;
}


/* =========================
   MARCO NEÓN ROSA
   ========================= */

#marco-neon {
    position: relative;

    width: 1100px;
    height: 150px;

    display: flex;
    align-items: center;

    /* IMPORTANTE:
       impide que las letras salgan fuera del marco */
    overflow: hidden;

    background: transparent;

    border: 3px solid #ffd5ff;
    border-radius: 80px;

    box-shadow:
        0 0 3px #ffffff,
        0 0 6px #ffd5ff,
        0 0 12px #ff70e8,
        0 0 22px #ff28cc,
        0 0 40px rgba(255, 0, 200, 0.85),
        0 0 65px rgba(255, 0, 180, 0.55),

        inset 0 0 4px #ffffff,
        inset 0 0 10px #ff5ddd,
        inset 0 0 20px rgba(255, 0, 200, 0.65);
}


/* =========================
   LETRAS NEÓN
   ========================= */

#bienvenida {

    position: absolute;

    /* Empieza fuera del marco por la izquierda */
    left: 0;

    color: #fff4ff;

    font-size: 90px;
    font-weight: 300;

    white-space: nowrap;

    text-shadow:
        0 0 1px #ffffff,
        0 0 2px #ffffff,
        0 0 4px #ffeaff,
        0 0 7px #ffb6f5,
        0 0 10px #ff7be8,
        0 0 16px #ff39d4,
        0 0 25px #ff00c8,
        0 0 40px rgba(255, 0, 200, 0.95),
        0 0 60px rgba(255, 0, 180, 0.75);

    /* MOVIMIENTO DE 12 SEGUNDOS */
    animation: moverTexto 12s linear infinite;
}


/* =========================
   MOVIMIENTO
   IZQUIERDA → DERECHA
   ========================= */

@keyframes moverTexto {

    0% {
        transform: translateX(-100%);
    }

    100% {
        transform: translateX(1100px);
    }
}

</style>
</head>


<body>

<div id="marco-neon">

    <div id="bienvenida">
        BIENVENID@
    </div>

</div>


<script>

const params = new URLSearchParams(window.location.search);

let nombre = params.get("name");

if (!nombre || nombre.trim() === "") {
    nombre = "Visitante";
}

document.getElementById("bienvenida").textContent =
    "BIENVENID@ " + nombre;

</script>

</body>
</html>
