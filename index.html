<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<style>

* {
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: transparent !important;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
}


/* =====================================================
   MARCO NEÓN
   ===================================================== */

#marco-neon {
    position: relative;

    width: 1150px;
    height: 175px;

    display: flex;
    align-items: center;

    overflow: hidden;

    background: transparent;

    border: 3px solid rgba(255, 235, 252, 0.95);
    border-radius: 90px;

    box-shadow:
        0 0 2px #ffffff,
        0 0 6px #ffd9f8,
        0 0 11px #ff9be9,
        0 0 20px #ff4bd1,
        0 0 35px rgba(255, 0, 190, 0.80),
        0 0 60px rgba(255, 0, 180, 0.45),
        0 0 90px rgba(255, 0, 170, 0.20),

        inset 0 0 3px #ffffff,
        inset 0 0 9px #ffb4ee,
        inset 0 0 18px rgba(255, 20, 190, 0.60);

    animation: respirarMarco 4s ease-in-out infinite alternate;
}


/* =====================================================
   SEGUNDO TUBO INTERIOR
   ===================================================== */

#marco-neon::before {
    content: "";

    position: absolute;

    top: 9px;
    bottom: 9px;
    left: 9px;
    right: 9px;

    border-radius: 80px;

    border: 1px solid rgba(255, 145, 225, 0.45);

    box-shadow:
        0 0 5px rgba(255, 90, 215, 0.30),
        inset 0 0 12px rgba(255, 40, 195, 0.25);

    pointer-events: none;
}


/* =====================================================
   REFLEJO DEL MARCO
   ===================================================== */

#marco-neon::after {
    content: "";

    position: absolute;

    left: 7%;
    right: 7%;
    top: 18px;

    height: 1px;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.10),
        rgba(255,190,240,0.60),
        rgba(255,255,255,0.10),
        transparent
    );

    filter: blur(1px);

    pointer-events: none;
}


/* =====================================================
   ZONA DE RECORRIDO
   ===================================================== */

#recorrido {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;

    overflow: hidden;
}


/* =====================================================
   TEXTO NEÓN
   ===================================================== */

#bienvenida {
    position: absolute;

    /*
       El punto de referencia está exactamente
       en el centro del marco.
    */
    left: 50%;

    color: #fff8ff;

    font-size: 82px;
    font-weight: 300;

    letter-spacing: 4px;

    white-space: nowrap;

    text-shadow:

        /* Núcleo blanco */
        0 0 1px #ffffff,
        0 0 2px #ffffff,
        0 0 4px #fff5ff,

        /* Rosa claro */
        0 0 7px #ffc6f2,
        0 0 11px #ff94e7,

        /* Rosa intenso */
        0 0 17px #ff55d7,
        0 0 25px #ff1fc6,

        /* Halo exterior */
        0 0 38px rgba(255,0,190,0.90),
        0 0 55px rgba(255,0,180,0.60),
        0 0 80px rgba(255,0,170,0.30);

    /*
       CICLO COMPLETO: 18 segundos

       15 segundos de movimiento
       +
       3 segundos parado
    */

    animation:
        recorridoTexto 18s linear infinite,
        respirarTexto 2.8s ease-in-out infinite alternate;

    will-change: transform;
}


/* =====================================================
   MOVIMIENTO

   ENTRA
        ↓
   SE CENTRA
        ↓
   PARA 3 SEGUNDOS
        ↓
   CONTINÚA
        ↓
   SALE
   ===================================================== */

@keyframes recorridoTexto {

    /* Fuera completamente por la izquierda */
    0% {
        transform:
            translateX(calc(-575px - 100%));
    }


    /* Llega exactamente al centro */
    41.666% {
        transform:
            translateX(-50%);
    }


    /*
       Permanece en la misma posición
       durante 3 segundos
    */
    58.333% {
        transform:
            translateX(-50%);
    }


    /* Sale completamente por la derecha */
    100% {
        transform:
            translateX(575px);
    }
}


/* =====================================================
   BRILLO SUAVE DEL TEXTO
   ===================================================== */

@keyframes respirarTexto {

    from {
        text-shadow:
            0 0 1px #ffffff,
            0 0 2px #ffffff,
            0 0 4px #fff5ff,

            0 0 7px #ffc6f2,
            0 0 11px #ff94e7,

            0 0 17px #ff55d7,
            0 0 25px #ff1fc6,

            0 0 38px rgba(255,0,190,0.75),
            0 0 55px rgba(255,0,180,0.45),
            0 0 75px rgba(255,0,170,0.20);
    }

    to {
        text-shadow:
            0 0 2px #ffffff,
            0 0 4px #ffffff,
            0 0 6px #fff5ff,

            0 0 9px #ffd3f6,
            0 0 14px #ffa0ea,

            0 0 21px #ff60dc,
            0 0 31px #ff20ca,

            0 0 45px rgba(255,0,195,0.90),
            0 0 65px rgba(255,0,180,0.60),
            0 0 90px rgba(255,0,170,0.30);
    }
}


/* =====================================================
   BRILLO SUAVE DEL MARCO
   ===================================================== */

@keyframes respirarMarco {

    from {
        filter:
            brightness(0.95)
            saturate(0.96);
    }

    to {
        filter:
            brightness(1.06)
            saturate(1.05);
    }
}

</style>
</head>


<body>


<div id="marco-neon">

    <div id="recorrido">

        <div id="bienvenida">
            BIENVENID@
        </div>

    </div>

</div>


<script>

/* =====================================================
   RECIBIR DATOS DE UTHERVERSE
   ===================================================== */

const params =
    new URLSearchParams(window.location.search);

let nombre =
    params.get("name");

const uid =
    params.get("uid");


/* Si Utherverse no manda un nombre */

if (!nombre || nombre.trim() === "") {
    nombre = "Visitante";
}


/* =====================================================
   MOSTRAR EL NOMBRE
   ===================================================== */

const texto =
    document.getElementById("bienvenida");

texto.textContent =
    "BIENVENID@  " + nombre;


/* =====================================================
   AJUSTE AUTOMÁTICO PARA NOMBRES LARGOS

   Si el nombre es demasiado largo,
   reduce las letras automáticamente
   hasta que todo entre dentro del marco.
   ===================================================== */

function ajustarTexto() {

    const marco =
        document.getElementById("marco-neon");

    /* Tamaño normal */
    let tamaño = 82;

    texto.style.fontSize =
        tamaño + "px";


    /*
       Dejamos 100 píxeles de margen:
       50 izquierda + 50 derecha
    */

    const anchoMaximo =
        marco.clientWidth - 100;


    /*
       Reducimos progresivamente
       hasta que todo el mensaje entre.
    */

    while (
        texto.scrollWidth > anchoMaximo &&
        tamaño > 42
    ) {

        tamaño--;

        texto.style.fontSize =
            tamaño + "px";
    }
}


/* Ejecutar al cargar */

ajustarTexto();


/* Recalcular si cambia el tamaño */

window.addEventListener(
    "resize",
    ajustarTexto
);

</script>


</body>
</html>
